<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizmos Retro Education - DOS Game</title>
    
    <!-- Load stable js-dos files directly from jsDelivr CDN -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script src="https://jsdelivr.net"></script>
    
    <style>
        html, body, #dosbox {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: #000;
        }
    </style>
</head>
<body>

    <div id="dosbox"></div>

    <script>
        // Wait a split second to make sure the library is fully active in the browser
        window.onload = function() {
            if (typeof Dos !== 'undefined') {
                Dos(document.getElementById("dosbox"))
                    .run("./Gizmos.zip", "ssg.EXE");
            } else {
                alert("The emulator player script failed to load. Please refresh the page.");
            }
        };
    </script>

</body>
</html>
