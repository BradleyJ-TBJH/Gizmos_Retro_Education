<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizmos Retro Education - DOS Game</title>
    <!-- Load js-dos version 8 styling and scripts -->
    <link rel="stylesheet" href="https://js-dos.com">
    <script src="https://js-dos.com"></script>
    <style>
        html, body, #dosbox {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: #000;
        }
    </style>
</head>
<body>

    <div id="dosbox"></div>

    <script>
        // Use the window object to make sure js-dos is fully recognized by the browser
        const dosInterface = window.Dos || Dos;
        
        if (dosInterface) {
            dosInterface(document.getElementById("dosbox"))
                .run("./Gizmos.zip", "ssg.EXE");
        } else {
            console.error("js-dos failed to initialize properly.");
        }
    </script>

</body>
</html>
